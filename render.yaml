services:
  - type: web
    name: collectrbrief-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: ADMIN_KEY
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: CLIENT_ORIGIN
        value: https://collectrbrief.onrender.com
      - key: PORT
        value: 3001

