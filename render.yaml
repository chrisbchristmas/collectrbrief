services:
  - type: web
    name: collectrbrief-api
    runtime: node
    buildCommand: cd server && npm install
    startCommand: cd server && node index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: ADMIN_KEY
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: CLIENT_ORIGIN
        value: https://collectrbrief.onrender.com
      - key: PORT
        value: 3001

  - type: web
    name: collectrbrief-client
    runtime: node
    buildCommand: cd client && npm install && npm run build
    startCommand: cd client && npm run preview
    envVars:
      - key: VITE_API_URL
        value: https://collectrbrief-api.onrender.com
      - key: PORT
        value: 5173
